# Taskfile for apiggo — https://taskfile.dev
# Install go-task: https://taskfile.dev/installation/  (brew install go-task)
# List tasks: `task --list`   Run: `task <name>`
version: "3"

vars:
  BIN_DIR: "{{.ROOT_DIR}}/bin"
  BINARY: "{{.BIN_DIR}}/apiggo"
  PKG: ./...
  COVERAGE: coverage.out

  GOLANGCI_LINT_VERSION: v2.12.2
  GOLANGCI_LINT: "{{.BIN_DIR}}/golangci-lint"

tasks:
  build:
    desc: Compile the generator, runtime, and CLI into ./bin/apiggo
    cmds:
      - go build -o {{.BINARY}} ./cmd/apiggo
    generates:
      - "{{.BINARY}}"

  run:
    desc: 'Run the generator. Pass args: task run -- -schema api/openapi.yaml -module github.com/acme/svc'
    cmds:
      - go run ./cmd/apiggo {{.CLI_ARGS}}

  test:
    desc: Run the full test suite (unit + golden)
    cmds:
      - go test {{.PKG}}

  test:race:
    desc: Run tests with the race detector (matches CI)
    cmds:
      - go test -race {{.PKG}}

  test:cover:
    desc: Run tests with coverage and open an HTML report
    cmds:
      - go test -coverprofile={{.COVERAGE}} {{.PKG}}
      - go tool cover -func={{.COVERAGE}} | tail -n 1
      - go tool cover -html={{.COVERAGE}}

  golden:
    desc: Regenerate the codegen golden fixtures (review the diff before committing!)
    cmds:
      - go test ./pkg/codegen/... -run TestGenerateGolden -update
      - 'echo "Golden fixtures updated — inspect the diff: git diff pkg/codegen/testdata"'

  vet:
    desc: Run go vet static checks
    cmds:
      - go vet {{.PKG}}

  install-golangci-lint:
    desc: Install golangci-lint into ./bin (skipped if already present)
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - echo "📦 Installing golangci-lint {{.GOLANGCI_LINT_VERSION}}..."
      - GOBIN={{.BIN_DIR}} go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
    status:
      - test -x {{.GOLANGCI_LINT}}

  lint:
    desc: Run golangci-lint (config in .golangci.yml)
    deps:
      - install-golangci-lint
    cmds:
      - "{{.GOLANGCI_LINT}} run"

  tidy:
    desc: Tidy and verify go.mod / go.sum
    cmds:
      - go mod tidy
      - go mod verify

  check:
    desc: Run everything CI runs — vet, lint (incl. gofmt/goimports), race tests
    deps:
      - vet
      - lint
      - test:race

  clean:
    desc: Remove build and coverage artifacts
    cmds:
      - rm -rf {{.BIN_DIR}} {{.COVERAGE}} coverage.html
      - go clean -testcache
